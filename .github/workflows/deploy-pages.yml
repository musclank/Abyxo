name: Deploy ABYXO website to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy shared brand assets into website
        run: |
          mkdir -p ./website/assets/logo ./website/assets/mascot
          cp ./assets/logo/abyxo-logo.svg ./website/assets/logo/abyxo-logo.svg
          cp ./assets/mascot/abyxo-mascot.svg ./website/assets/mascot/abyxo-mascot.svg

      - name: Prepare website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./website"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
